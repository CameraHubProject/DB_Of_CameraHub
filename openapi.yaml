        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Business conflict
        '422':
          description: State transition rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
