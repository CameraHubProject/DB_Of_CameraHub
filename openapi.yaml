openapi: 3.0.3
info:
  title: CameraHub Marketplace MVP API
  version: 2.1.0
  description: PostgreSQL-backed contract. All payment, payout and refund operations are simulated in MVP. Operation
    IDs are stable identifiers.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Auth
- name: Catalog
- name: Seller
- name: Admin
- name: Inspection
- name: Orders
- name: Shipping
- name: Disputes
- name: AI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
          example: PRODUCT_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true
    ProductCreate:
      type: object
      required:
      - modelId
      - title
      - priceVnd
      - description
      - conditionNotes
      - mediaKeys
      properties:
        modelId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
        priceVnd:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
        conditionNotes:
          type: string
        serialNumber:
          type: string
        shutterCount:
          type: integer
          minimum: 0
        repairHistory:
          type: string
        accessories:
          type: string
        mediaKeys:
          type: array
          minItems: 1
          items:
            type: string
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        title:
          type: string
        priceVnd:
          type: integer
          format: int64
        listingStatus:
          type: string
        inspectionBadge:
          type: string
        version:
          type: integer
    AgreementProposal:
      type: object
      required:
      - buyerSharePct
      - sellerSharePct
      - expectedVersion
      properties:
        buyerSharePct:
          type: integer
          minimum: 0
          maximum: 100
        sellerSharePct:
          type: integer
          minimum: 0
          maximum: 100
        expectedVersion:
          type: integer
          minimum: 0
        note:
          type: string
      description: Shares must sum to 100. Seller-only request must have buyerSharePct=0.
    InspectionRequestCreate:
      type: object
      required:
      - productId
      properties:
        productId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
      description: Seller or identified buyer can initiate. Service quote is set by trusted admin, not client.
    ChecklistUpdate:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - checkCode
            - result
            properties:
              checkCode:
                type: string
              result:
                type: string
                enum:
                - PASS
                - FAIL
                - WARNING
                - NOT_TESTED
              notes:
                type: string
              evidenceStorageKey:
                type: string
    OrderCreate:
      type: object
      required:
      - productId
      - shippingAddressId
      - shippingQuoteId
      - idempotencyKey
      properties:
        productId:
          type: string
          format: uuid
        shippingAddressId:
          type: string
          format: uuid
        shippingQuoteId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        orderStatus:
          type: string
        agreedPriceVnd:
          type: integer
          format: int64
        shippingFeeVnd:
          type: integer
          format: int64
        transactionFeeVnd:
          type: integer
          example: 0
        totalVnd:
          type: integer
          format: int64
        paymentDeadline:
          type: string
          format: date-time
    ShipmentCreate:
      type: object
      required:
      - providerCode
      properties:
        providerCode:
          type: string
          enum:
          - MOCK
    ShippingQuoteCreate:
      type: object
      required:
      - productId
      - shippingAddressId
      properties:
        productId:
          type: string
          format: uuid
        shippingAddressId:
          type: string
          format: uuid
    DisputeCreate:
      type: object
      required:
      - reasonCode
      - description
      properties:
        reasonCode:
          type: string
          enum:
          - NOT_AS_DESCRIBED
          - DEFECT
          - MISSING_ACCESSORIES
          - WRONG_ITEM
          - NOT_RECEIVED
          - OTHER
        description:
          type: string
          minLength: 10
        evidenceKeys:
          type: array
          items:
            type: string
    DisputeDecision:
      type: object
      required:
      - decisionType
      - reason
      properties:
        decisionType:
          type: string
          enum:
          - RELEASE
          - FULL_REFUND
          - PARTIAL_REFUND
          - MORE_EVIDENCE
        reason:
          type: string
        refundAmountVnd:
          type: integer
          format: int64
          minimum: 0
    AIRecommendationRequest:
      type: object
      required:
      - budgetMaxVnd
      - purposes
      properties:
        budgetMinVnd:
          type: integer
          minimum: 0
        budgetMaxVnd:
          type: integer
          minimum: 1
        purposes:
          type: array
          items:
            type: string
        experienceLevel:
          type: string
          enum:
          - BEGINNER
          - INTERMEDIATE
          - ADVANCED
        brandIds:
          type: array
          items:
            type: string
            format: uuid
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Register user
      responses:
        '201':
          description: Success
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Business conflict
        '422':
          description: State transition rejected
      security: []
  /api/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Obtain access token
      responses:
        '200':
          description: Success
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
